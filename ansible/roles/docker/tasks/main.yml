---
- name: Validate supported operating system
  ansible.builtin.assert:
    that:
      - ansible_os_family == "Debian"
      - ansible_distribution in ["Debian", "Ubuntu"]
    fail_msg: "This playbook currently supports Debian and Ubuntu."

- name: Select Docker repository distribution
  ansible.builtin.set_fact:
    docker_repository_distribution: "{{ ansible_distribution | lower }}"

- name: Install Docker repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create APT keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Docker repository signing key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ docker_repository_distribution }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Detect Debian package architecture
  ansible.builtin.command:
    cmd: dpkg --print-architecture
  register: docker_apt_arch
  changed_when: false

- name: Configure Docker APT repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.list
    content: >-
      deb [arch={{ docker_apt_arch.stdout }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/{{ docker_repository_distribution }}
      {{ ansible_distribution_release }} stable
    owner: root
    group: root
    mode: "0644"
  register: docker_repository

- name: Update APT cache after repository configuration
  ansible.builtin.apt:
    update_cache: true
  when: docker_repository.changed

- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Enable and start Docker service
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Check Projeto Korp Docker network
  ansible.builtin.command:
    cmd: docker network inspect korp-network
  register: korp_network
  changed_when: false
  failed_when: false

- name: Create Projeto Korp Docker network
  ansible.builtin.command:
    cmd: docker network create --driver bridge korp-network
  when: korp_network.rc != 0
  changed_when: true
