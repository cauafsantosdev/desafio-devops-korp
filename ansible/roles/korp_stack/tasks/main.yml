---
- name: Create Projeto Korp deployment directory
  ansible.builtin.file:
    path: "{{ korp_project_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy Docker Compose file
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../compose.yaml"
    dest: "{{ korp_project_dir }}/compose.yaml"
    owner: root
    group: root
    mode: "0644"

- name: Copy application source
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../app/"
    dest: "{{ korp_project_dir }}/app/"
    owner: root
    group: root
    mode: preserve

- name: Copy NGINX configuration
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../nginx/"
    dest: "{{ korp_project_dir }}/nginx/"
    owner: root
    group: root
    mode: preserve

- name: Copy Prometheus configuration
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../prometheus/"
    dest: "{{ korp_project_dir }}/prometheus/"
    owner: root
    group: root
    mode: preserve

- name: Copy Grafana provisioning files
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../grafana/"
    dest: "{{ korp_project_dir }}/grafana/"
    owner: root
    group: root
    mode: preserve

- name: Validate Docker Compose configuration
  ansible.builtin.command:
    cmd: docker compose config --quiet
    chdir: "{{ korp_project_dir }}"
  environment:
    GRAFANA_ADMIN_PASSWORD: "{{ grafana_admin_password }}"
  changed_when: false

- name: Build and start Projeto Korp stack
  ansible.builtin.command:
    cmd: docker compose up -d --build --remove-orphans
    chdir: "{{ korp_project_dir }}"
  environment:
    GRAFANA_ADMIN_PASSWORD: "{{ grafana_admin_password }}"
  register: compose_up
  changed_when: >-
    'Created' in compose_up.stderr or
    'Recreated' in compose_up.stderr or
    'Started' in compose_up.stderr or
    'Restarted' in compose_up.stderr

- name: Show Docker Compose services
  ansible.builtin.command:
    cmd: docker compose ps
    chdir: "{{ korp_project_dir }}"
  register: compose_ps
  changed_when: false

- name: Display Docker Compose services
  ansible.builtin.debug:
    var: compose_ps.stdout_lines

- name: Wait for reverse proxy to become ready
  ansible.builtin.uri:
    url: http://127.0.0.1/healthz
    method: GET
    status_code: 200
  register: korp_health
  retries: 30
  delay: 2
  until: korp_health.status == 200

- name: Validate Projeto Korp HTTP endpoint
  ansible.builtin.uri:
    url: http://127.0.0.1/projeto-korp
    method: GET
    return_content: true
    status_code: 200
  register: korp_response

- name: Validate Projeto Korp response payload
  ansible.builtin.assert:
    that:
      - korp_response.json.nome == "Projeto Korp"
      - korp_response.json.horario is defined
      - korp_response.json.horario | length > 0
    fail_msg: "Projeto Korp endpoint returned an unexpected payload."

- name: Display Projeto Korp response
  ansible.builtin.debug:
    var: korp_response.json

- name: Wait for Prometheus to become ready
  ansible.builtin.uri:
    url: http://127.0.0.1:9090/-/ready
    method: GET
    status_code: 200
  register: prometheus_ready
  retries: 30
  delay: 2
  until: prometheus_ready.status == 200

- name: Wait for Grafana to become ready
  ansible.builtin.uri:
    url: http://127.0.0.1:3000/api/health
    method: GET
    return_content: true
    status_code: 200
  register: grafana_health
  retries: 30
  delay: 2
  until:
    - grafana_health.status == 200
    - grafana_health.json.database == "ok"

- name: Validate Prometheus target availability
  ansible.builtin.uri:
    url: >-
      http://127.0.0.1:9090/api/v1/query?query=up%7Bjob%3D%22http-server-projeto-korp%22%7D%20%3D%3D%201
    method: GET
    return_content: true
    status_code: 200
  register: prometheus_target
  retries: 15
  delay: 2
  until:
    - prometheus_target.status == 200
    - prometheus_target.json.status == "success"
    - prometheus_target.json.data.result | length > 0
