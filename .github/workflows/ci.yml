name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Verify modules
        run: go mod verify

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

  stack:
    name: Docker Compose stack
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Create external Docker network
        run: docker network create --driver bridge korp-network

      - name: Build and start stack
        run: docker compose up -d --build

      - name: Validate application through NGINX
        run: |
          curl --fail --retry 30 --retry-connrefused --retry-delay 2 --retry-all-errors http://localhost/projeto-korp

      - name: Validate Prometheus
        run: |
          curl --fail --retry 30 --retry-connrefused --retry-delay 2 --retry-all-errors http://localhost:9090/-/ready

      - name: Validate Grafana
        run: |
          curl --fail --retry 30 --retry-connrefused --retry-delay 2 --retry-all-errors http://localhost:3000/api/health

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  ansible:
    name: Ansible
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Ansible Core
        run: python -m pip install ansible-core==2.21.3

      - name: Validate playbook syntax
        run: ansible-playbook --syntax-check ansible/site.yml
